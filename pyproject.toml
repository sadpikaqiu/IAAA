[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iaa-agent"
version = "0.1.0"
description = "NYC-first Intention-Affordance Aligned Agent for next POI recommendation"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pydantic",
  "typer",
  "rich",
  "python-dotenv",
  "scikit-learn",
]

[project.scripts]
iaa-agent = "iaa_agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["iaa_agent*"]
exclude = ["cases*", "datasets*", "docs*", "outputs*", "reference*", "tests*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
